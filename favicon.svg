<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradients specifically crafted to shine on both Dark (#030611) and Light (#ffffff) themes -->
    <linearGradient id="mph-grad-left" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="55%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="mph-grad-diag1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="mph-grad-diag2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="mph-grad-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mph-grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="mph-logo-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <g filter="url(#mph-logo-depth)">
    <!-- Left Vertical Pillar -->
    <polygon points="14,84 14,24 28,14 28,84" fill="url(#mph-grad-left)"/>
    
    <!-- Left Diagonal Chevron -->
    <polygon points="28,24 50,62 50,78 28,40" fill="url(#mph-grad-diag1)"/>
    
    <!-- Right Diagonal Chevron -->
    <polygon points="50,62 72,24 72,40 50,78" fill="url(#mph-grad-diag2)"/>
    
    <!-- Right Vertical Pillar -->
    <polygon points="72,14 86,24 86,84 72,84" fill="url(#mph-grad-right)"/>
    
    <!-- Center Core Floating Prism -->
    <polygon points="50,42 56,51 50,60 44,51" fill="url(#mph-grad-core)"/>
  </g>
</svg>